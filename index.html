<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ Gesture Mixer</title>
</head>

<body>
  <div id="app">
    <video id="input_video" style="display: none;"></video>
    <canvas id="output_canvas"></canvas>

    <!-- DJ Control Panel -->
    <div id="track-panel">
      <h3>🎧 DJ Gesture Mixer</h3>

      <!-- Track A -->
      <div class="track-control track-a">
        <label>🟢 Track A:</label>
        <input type="file" id="track-a-input" accept="audio/*">
        <div id="track-a-status" class="track-status">No file loaded</div>
      </div>

      <!-- Track B -->
      <div class="track-control track-b">
        <label>🔴 Track B:</label>
        <input type="file" id="track-b-input" accept="audio/*">
        <div id="track-b-status" class="track-status">No file loaded</div>
      </div>

      <!-- Play All Button -->
      <button id="play-all-btn" class="play-all-btn">▶️ Play All</button>

      <!-- Status Displays -->
      <div class="status-row">
        <div id="master-volume-display" class="status-display master">Master: 70%</div>
        <div id="crossfader-display" class="status-display crossfader">Crossfader: 50%</div>
      </div>
      <div class="status-row"></div>
        <div id="bass-display" class="status-display bass">Bass: 0dB</div>
        <div id="treble-display" class="status-display treble">Treble: 0dB</div>
      </div>

      <!-- Control Hints -->
      <div class="hints">
        <div class="hint-section">
          <span class="hint-icon">🖐️</span>
          <div class="hint-content">
            <strong>Right Hand</strong>
            <p>Pinch = Play/Pause</p>
            <p>Pinch + ↕ = Master Volume</p>
          </div>
        </div>
        <div class="hint-section">
          <span class="hint-icon">🖐️</span>
          <div class="hint-content">
            <strong>Left Hand</strong>
            <p>Pinch + ↕ = Crossfader</p>
            <p class="fade-hint">↑ Track A | ↓ Track B</p>
          </div>
        </div>
        <div class="hint-section">
          <span class="hint-icon">✊</span>
          <div class="hint-content">
            <strong>Fist Gestures (EQ)</strong>
            <p>Right Fist + ↕ = Bass</p>
            <p>Left Fist + ↕ = Treble</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumaire - Gesture-Driven Audio Control</title>
</head>

<body>
  <div id="app">
    <video id="input_video" style="display: none;"></video>
    <canvas id="output_canvas"></canvas>

    <!-- DJ Control Panel -->
    <div id="track-panel">
      <!-- Branding Header -->
      <div class="brand-header">
        <h1 class="brand-name">Lumaire</h1>
        <p class="brand-tagline">Control sound with light & motion</p>
      </div>

      <!-- Track A -->
      <div class="track-control track-a">
        <label>🟢 Track A:</label>
        <input type="file" id="track-a-input" accept="audio/*">
      </div>

      <!-- Track B -->
      <div class="track-control track-b">
        <label>🔴 Track B:</label>
        <input type="file" id="track-b-input" accept="audio/*">
      </div>

      <!-- Individual Play Buttons -->
      <div class="play-buttons">
        <button id="play-track-a-btn" class="play-all-btn">▶️ Play A</button>
        <button id="play-track-b-btn" class="play-all-btn">▶️ Play B</button>
      </div>

      <!-- Status Displays -->
      <div class="status-row">
        <div id="master-volume-display" class="status-display master">Master: 70%</div>
        <div id="crossfader-display" class="status-display crossfader">Crossfader: 50%</div>
      </div>
      <div class="status-row">
        <div id="bass-display" class="status-display bass">Bass: 0dB</div>
        <div id="treble-display" class="status-display treble">Treble: 0dB</div>
      </div>

      <!-- Control Hints (Collapsible) -->
      <div id="hints-panel" class="hints">
        <div id="hints-header" class="hints-header">
          <span>Gesture Controls</span>
          <span class="hints-toggle">▼</span>
        </div>
        <div id="hints-content" class="hints-content">
          <div class="hint-section">
            <span class="hint-icon">🖐️</span>
            <div class="hint-content">
              <strong>Right Hand</strong>
              <p>Pinch = Play/Pause</p>
              <p>Pinch + ⭥ = Volume</p>
            </div>
          </div>
          <div class="hint-section">
            <span class="hint-icon">🖐️</span>
            <div class="hint-content">
              <strong>Left Hand</strong>
              <p>Pinch + ⭤ = Crossfader</p>
            </div>
          </div>
          <div class="hint-section">
            <span class="hint-icon">✊</span>
            <div class="hint-content">
              <strong>Fist Gestures</strong>
              <p>Right = Bass | Left = Treble</p>
            </div>
          </div>
          <div class="hint-section">
            <span class="hint-icon">👏</span>
            <div class="hint-content">
              <strong id="hint-clap-title">Clap</strong>
              <p id="hint-clap">Clap = Beat alignment</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
